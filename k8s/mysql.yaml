# The mysql-secret Secret is NOT defined here on purpose: committing it would ship
# placeholder credentials and `kubectl apply` would overwrite the real ones.
# Create it first; see k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: ktebna
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ktebna
spec:
  replicas: 1
  # Stop the old pod before starting the new one: two MySQL instances can't share
  # one data volume (the new one fails with "Unable to lock ./ibdata1").
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # None of these pods call the Kubernetes API, so they don't need its
      # credentials mounted (they would only help an attacker who got in).
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: ktebna
            - name: MYSQL_USER
              value: ktebna_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          # MySQL 8 uses about 420 MiB here. Data lives on the PVC; ephemeral
          # storage covers temp tables and logs.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 100Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ktebna
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
