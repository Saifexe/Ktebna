apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ktebna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # None of these pods call the Kubernetes API, so they don't need its
      # credentials mounted (they would only help an attacker who got in).
      automountServiceAccountToken: false
      containers:
        - name: frontend
          # The image CI built, scanned and published on main. The node can't pull
          # from the GitLab registry itself (see README Known Issues), so
          # scripts/k8s-load-images.sh <tag> pulls it on the host and loads it in.
          # `Never` makes a missing image fail loudly instead of falling back to
          # the broken registry pull.
          image: registry.gitlab.com/saifexd-group/ktebna/frontend:6586d1f0
          imagePullPolicy: Never
          # The image runs nginx as a non-root user, so it listens on 8080 (ports
          # below 1024 need root). nginx also proxies /api and /uploads to the
          # `backend` Service.
          ports:
            - containerPort: 8080
          # nginx serving static files uses about 20 MiB.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ktebna
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
