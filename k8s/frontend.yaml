apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ktebna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: frontend
          # TODO (documented, not implemented — k8s redeploys parked, see README Known Issues):
          # Replace manual digest pinning with $CI_COMMIT_SHORT_SHA-tagged images once
          # the k8s image-pull bug is resolved. CI already builds these tags
          # (.gitlab-ci.yml build-backend/build-frontend jobs) — just needs wiring
          # into a deploy stage and this image: field.
          image: registry.gitlab.com/saifexd-group/ktebna/frontend@sha256:3b4e0f9ff2d0f6f104c68b37ff9f0131f09beac188e0c8500c33c2bc0e128bd8
          imagePullPolicy: IfNotPresent
          # The pinned digest predates the non-root image and still listens on 80.
          # Images built from the current Dockerfile listen on 8080: when re-pinning,
          # change containerPort, both probe ports and the Service targetPort to 8080.
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ktebna
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80