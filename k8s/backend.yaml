# The backend-secret Secret is NOT defined here on purpose: committing it would ship
# placeholder credentials and `kubectl apply` would overwrite the real ones.
# Create it first; see k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: ktebna
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ktebna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # The image runs as uid/gid 10001; fsGroup makes the uploads PVC writable
      # for it (a fresh volume is otherwise owned by root).
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          # Loaded straight into the node, not pulled: the node can't pull from the
          # GitLab registry (see README Known Issues). Build with Compose, then run
          # scripts/k8s-load-images.sh <tag>. `Never` makes a missing image fail
          # loudly instead of falling back to the broken registry pull.
          image: ktebna/backend:a1e79d1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: ktebna
            - name: DB_USER
              value: ktebna_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-secret
            - name: DDL_AUTO
              value: update
            - name: UPLOAD_DIR
              value: /app/uploads
          volumeMounts:
            - name: backend-uploads
              mountPath: /app/uploads
          # Readiness: "can you serve requests?" /actuator/health answers UP only
          # when the app AND its database connection work; until then the Service
          # sends it no traffic.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          # Liveness: "is the process still alive?" Kept to the open port on
          # purpose: if MySQL goes down, restarting the backend wouldn't fix it,
          # so a DB outage should mark the pod not-ready, not restart it.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ktebna
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
