apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: ktebna
type: Opaque
stringData:
  jwt-secret: change-this-to-a-long-random-secret-of-at-least-32-characters
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: ktebna
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ktebna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: registry.gitlab.com/saifexd-group/ktebna/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: ktebna
            - name: DB_USER
              value: ktebna_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-secret
            - name: APP_BASE_URL
              value: http://backend:8080
            - name: DDL_AUTO
              value: update
            - name: UPLOAD_DIR
              value: /app/uploads
          volumeMounts:
            - name: backend-uploads
              mountPath: /app/uploads
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ktebna
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
