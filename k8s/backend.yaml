# The backend-secret Secret is NOT defined here on purpose: committing it would ship
# placeholder credentials and `kubectl apply` would overwrite the real ones.
# Create it first; see k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: ktebna
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ktebna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # None of these pods call the Kubernetes API, so they don't need its
      # credentials mounted (they would only help an attacker who got in).
      automountServiceAccountToken: false
      # The image runs as uid/gid 10001; fsGroup makes the uploads PVC writable
      # for it (a fresh volume is otherwise owned by root).
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          # The image CI built, scanned and published on main. The node can't pull
          # from the GitLab registry itself (see README Known Issues), so
          # scripts/k8s-load-images.sh <tag> pulls it on the host and loads it in.
          # `Never` makes a missing image fail loudly instead of falling back to
          # the broken registry pull.
          image: registry.gitlab.com/saifexd-group/ktebna/backend:bccadd04
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: ktebna
            - name: DB_USER
              value: ktebna_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-secret
            - name: DDL_AUTO
              value: validate
            # Uploads live in Garage (garage.yaml), shared by every backend pod.
            # The old volume below stays mounted until its files are imported and
            # checked (k8s/jobs/garage-import-uploads.yaml); STORAGE_TYPE=disk
            # switches back to it.
            - name: STORAGE_TYPE
              value: s3
            - name: S3_ENDPOINT
              value: http://garage:3900
            - name: S3_REGION
              value: garage
            - name: S3_BUCKET
              value: ktebna-uploads
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secret
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secret
                  key: secret-key
            - name: UPLOAD_DIR
              value: /app/uploads
            # Java sizes its heap from the container limit, but only 25% by
            # default; 75% leaves room for the JVM's own memory.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          # Requests reserve what the pod needs to be scheduled; limits stop a
          # leak in one pod from starving the rest. Sized from measured use
          # (about 770 MiB unbounded under Compose). Uploads live on the PVC,
          # so ephemeral storage only covers logs and temp files.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 100Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: backend-uploads
              mountPath: /app/uploads
          # Readiness: "can you serve requests?" /actuator/health answers UP only
          # when the app AND its database connection work; until then the Service
          # sends it no traffic.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          # Liveness: "is the process still alive?" Kept to the open port on
          # purpose: if MySQL goes down, restarting the backend wouldn't fix it,
          # so a DB outage should mark the pod not-ready, not restart it.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ktebna
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
