# Rate-limit zones (this file is included inside nginx's http block).
# Auth endpoints: blunts password guessing and account spam at the edge.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# General API ceiling per client.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# The Spring Boot backend. keepalive holds a few connections open between
# requests instead of opening a new one each time (needs HTTP/1.1 and an empty
# Connection header, set in the server block).
upstream ktebna_backend {
    server backend:8080;
    keepalive 16;
}

server {
    # Unprivileged port: the container runs as the non-root `nginx` user.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # A location that adds its own header would otherwise drop every header
    # below; merge keeps the security headers on all responses (nginx 1.29.3+).
    add_header_inherit merge;
    limit_req_status 429;

    # Browser hardening. Google Fonts and Google Maps are the only third
    # parties; uploaded images are same-origin (proxied under /uploads/).
    # The Maps domains follow Google's CSP guide; re-check the browser console
    # for CSP errors after enabling VITE_GOOGLE_MAPS_API_KEY.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https://*.googleapis.com https://*.google.com https://*.gstatic.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Shared by every proxied location (a location that set its own
    # proxy_set_header would drop all of these, so none does).
    # $http_host (host AND port), not $host (host only): the backend compares
    # it with the browser's Origin header, and a missing port made same-site
    # requests on any port but 5173 fail as "Invalid CORS request".
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx sets these on every response (above); drop Spring Security's
    # copies so each header is sent once.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://ktebna_backend/api/auth/;
    }

    # Uploaded covers and avatars. The database stores relative /uploads/...
    # paths, so images keep working whatever host or domain serves the app.
    # Every upload gets a new random name and is never modified, so browsers
    # may keep it for a week; after that they re-check it cheaply (Last-Modified
    # -> 304) and a deleted listing's cover is gone within the week. Spring
    # Security's "no-cache, no-store" (meant for private data) made every visit
    # download all covers again.
    location /uploads/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://ktebna_backend/uploads/;
        # A location's own proxy_hide_header replaces the server-level list,
        # so the two security headers are repeated here.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        # Match Spring's multipart limit (8MB); nginx defaults to 1MB, which
        # rejected most phone photos with 413 before they reached the backend.
        client_max_body_size 8m;
        proxy_pass http://ktebna_backend/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The page itself must never be cached: it names the current build's
    # hashed assets, so a stale copy would keep loading the old version.
    # SPA routes reach it through try_files, so they get this too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Compress text, including API responses passed on from the backend
    # (gzip_proxied; nginx skips them by default). Tiny bodies aren't worth it.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
}
