# Rate-limit zones (this file is included inside nginx's http block).
# Auth endpoints: blunts password guessing and account spam at the edge.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# General API ceiling per client.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;
    limit_req_status 429;

    # Browser hardening. Google Fonts and Google Maps are the only third
    # parties; uploaded images may come from the backend's APP_BASE_URL.
    # The Maps domains follow Google's CSP guide; re-check the browser console
    # for CSP errors after enabling VITE_GOOGLE_MAPS_API_KEY.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:8080; connect-src 'self' data: blob: https://*.googleapis.com https://*.google.com https://*.gstatic.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        # Match Spring's multipart limit (10MB); nginx defaults to 1MB, which
        # rejected most phone photos with 413 before they reached the backend.
        client_max_body_size 10m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        # add_header in a location replaces the server-level ones, so repeat them.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
