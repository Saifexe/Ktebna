# Test profile. The datasource URL/user/password are replaced by the
# Testcontainers MySQL (@ServiceConnection); DB_PASSWORD only has to exist so the
# main application.properties placeholder resolves.
DB_PASSWORD=provided-by-testcontainers
JWT_SECRET=integration-test-secret-that-is-well-over-32-bytes-long

spring.jpa.hibernate.ddl-auto=create-drop
app.upload.dir=${java.io.tmpdir}/ktebna-test-uploads
# Never call the real mailer from tests (EmailNotificationService is also mocked).
app.mailer.url=http://127.0.0.1:9/disabled
# Tests register many users from one address; the limiter has its own tests.
app.rate-limit.enabled=false

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
