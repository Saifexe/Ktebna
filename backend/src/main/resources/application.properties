spring.application.name=ktebna-backend

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ktebna}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:ktebna_user}
# No default on purpose: the app must not start with a guessable password.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# create-drop or none for production; update is convenient for local/dev.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Times are Instants stored in UTC, whatever the JVM's own time zone (UTC in
# Docker, Africa/Tunis on a dev PC), and sent to browsers with a trailing "Z"
# so they show in the reader's local time. TIMESTAMP keeps the existing
# datetime(6) columns instead of MySQL's TIMESTAMP type (which ends in 2038).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# --- JWT ---
# Required, no default: anyone who knows the secret can forge login tokens.
# At least 32 random characters, e.g. `openssl rand -base64 48`.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- File storage ---
app.upload.dir=${UPLOAD_DIR:./uploads}

# --- External mailer (unchanged from the original frontend integration) ---
app.mailer.url=${MAILER_URL:https://mailer-kkjf.onrender.com/send-email}

# --- CORS ---
# Comma-separated browser origins allowed to call the API directly. Not needed
# behind the nginx proxy (same origin); used by the Vite dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Uploads ---
# 8 MB: ample for a cover photo, and caps what one request can make the server
# buffer (SonarCloud's limit for this setting). nginx.conf matches it.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

server.port=${SERVER_PORT:8080}
# Take host and port from the Host header nginx forwards, never from the
# X-Forwarded-* headers. Spring Boot turns those on by itself inside Kubernetes;
# X-Forwarded-Proto then made every request look like port 80, so same-site
# requests from any other port failed as "Invalid CORS request". Client IPs are
# handled by RateLimitFilter (X-Real-IP, trusted only from a private proxy).
server.forward-headers-strategy=none
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=ktebna-backend

# --- Metrics ---
# Without this, http.server.requests only exports _sum/_count/_max, so
# histogram_quantile() in Grafana has no buckets to work with.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s