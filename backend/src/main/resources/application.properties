spring.application.name=ktebna-backend

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ktebna}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:ktebna_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# create-drop or none for production; update is convenient for local/dev.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# IMPORTANT: override app.jwt.secret via env var in any real deployment.
# Must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-of-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- File storage ---
app.upload.dir=${UPLOAD_DIR:./uploads}
# Base URL used to build public links to uploaded files, e.g. http://localhost:8080
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- External mailer (unchanged from the original frontend integration) ---
app.mailer.url=${MAILER_URL:https://mailer-kkjf.onrender.com/send-email}

# --- Uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${SERVER_PORT:8080}
