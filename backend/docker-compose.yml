# Backend-only stack (MySQL + API). Secrets come from the git-ignored
# backend/.env; startup fails if a required one is missing. Ports are bound
# to 127.0.0.1 so they're unreachable from other machines on the network.

services:
  mysql:
    image: mysql:8.0
    container_name: ktebna-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ktebna
      MYSQL_USER: ktebna_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ktebna-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ktebna
      DB_USER: ktebna_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DDL_AUTO: update
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
