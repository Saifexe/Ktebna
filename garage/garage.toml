# Garage settings for docker-compose (Kubernetes has the same in k8s/garage.yaml).
# Secrets are not here: they come from .env as GARAGE_RPC_SECRET, S3_ACCESS_KEY
# and S3_SECRET_KEY.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
