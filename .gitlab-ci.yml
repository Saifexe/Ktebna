stages:
  - test
  - sonarcloud
  - security
  - build
  - scan


variables:
  DOCKER_TLS_CERTDIR: ""

  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"


cache:
  key: maven-repo
  paths:
    - .m2/repository


####################
# TEST STAGE
####################

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17

  # Integration tests start a real MySQL 8 with Testcontainers, so the job
  # needs a Docker daemon (same dind setup as the build jobs).
  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # The dind service is thrown away with the job, so the reaper isn't needed.
    TESTCONTAINERS_RYUK_DISABLED: "true"

  script:
    - cd backend
    - mvn test -B
    # LINE_MISSED / LINE_COVERED are columns 8 and 9 of JaCoCo's CSV.
    - |
      awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "Line coverage: %.1f%%\n", 100*c/(c+m)}' target/site/jacoco/jacoco.csv

  coverage: '/Line coverage: \d+\.\d+%/'

  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: backend/target/site/jacoco/jacoco.xml
    paths:
      - backend/target/site/jacoco/jacoco.xml
      - backend/target/classes/
    expire_in: 1 week


frontend-lint:
  stage: test
  image: node:20-alpine

  script:
    - cd ktebna
    - npm ci
    - npm run lint



####################
# SONARCLOUD STAGE
####################

sonarcloud-check:
  stage: sonarcloud

  image:
    name: sonarsource/sonar-scanner-cli:latest

  variables:
    GIT_DEPTH: "0"

  script:
    - sonar-scanner
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.organization=saifexd-group
      -Dsonar.projectKey=saifexd-group_ktebna
      -Dsonar.sources=.
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.scanner.skipJreProvisioning=true
      -Dsonar.exclusions=backend/src/test/**,**/node_modules/**,**/dist/**
      -Dsonar.java.binaries=backend/target/classes
      -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  allow_failure: true



####################
# SECURITY STAGE
####################

gitleaks:
  stage: security

  image:
    # Pinned: a scanner that changes under you makes gate results unreproducible.
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]

  variables:
    # Full clone, so every commit is scanned (a secret deleted in a later
    # commit is still exposed in history).
    GIT_DEPTH: "0"

  script:
    # Current files (including untracked build output in the job workspace)...
    - gitleaks dir . --verbose --redact
    # ...and the entire git history. Reviewed false positives: .gitleaksignore
    - gitleaks git . --verbose --redact --log-opts="--all"



trivy-fs-backend:
  stage: security

  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]

  script:
    - trivy fs --scanners vuln --offline-scan --exit-code 0 --severity LOW,MEDIUM ./backend
    - trivy fs --scanners vuln --offline-scan --exit-code 1 --severity HIGH,CRITICAL ./backend

  allow_failure: true



####################
# BUILD STAGE
####################

build-backend:

  stage: build

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_HOST: tcp://docker:2375

  script:

    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

    - docker build
      -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $BACKEND_IMAGE:latest
      ./backend

    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest



build-frontend:

  stage: build

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    # `--secret` needs BuildKit; don't rely on the CLI default.
    DOCKER_BUILDKIT: "1"

  script:

    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

    # The Maps key goes in as a BuildKit secret (never a --build-arg), so it
    # doesn't end up in the image history. Exported even when unset, because
    # `env=` needs the variable to exist; an empty key just hides the maps.
    - export VITE_GOOGLE_MAPS_API_KEY="${VITE_GOOGLE_MAPS_API_KEY:-}"
    - docker build
      --secret id=maps_key,env=VITE_GOOGLE_MAPS_API_KEY
      --build-arg VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      --build-arg VITE_GOOGLE_MAPS_MAP_ID=${VITE_GOOGLE_MAPS_MAP_ID:-}
      -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $FRONTEND_IMAGE:latest
      ./ktebna

    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest



####################
# IMAGE SCAN STAGE
####################

trivy-backend-image:
  stage: scan
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - build-backend
  script:
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 0 --severity LOW,MEDIUM $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 1 --severity HIGH,CRITICAL $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: true

trivy-frontend-image:
  stage: scan
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - build-frontend
  script:
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 0 --severity LOW,MEDIUM $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 1 --severity HIGH,CRITICAL $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: true
