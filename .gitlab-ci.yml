stages:
  - test
  - sonarcloud
  - security
  - build
  - scan

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: maven-repo
  paths:
    - .m2/repository

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn test -B
  rules:
    - changes:
        - backend/**/*

frontend-lint:
  stage: test
  image: node:20-alpine
  script:
    - cd ktebna
    - npm ci
    - npm run lint
  rules:
    - changes:
        - ktebna/**/*

sonarcloud-check:
  stage: sonarcloud
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    GIT_DEPTH: "0"
  script:
    - env | grep -i SONAR
    #- echo "SONAR_TOKEN length is ${#SONAR_TOKEN}"
    #- echo "SONAR_HOST_URL length is ${#SONAR_HOST_URL}"
    #- echo "DEBUG_TEST_VAR length is ${#DEBUG_TEST_VAR}"
    #- echo "DEBUG_TEST_VAR2 length is ${#DEBUG_TEST_VAR2}"
    - sonar-scanner -Dsonar.token=$SONAR_TOKEN -Dsonar.organization=saifexd-group -Dsonar.projectKey=saifexd-group_ktebna -Dsonar.sources=. -Dsonar.host.url=https://sonarcloud.io -Dsonar.scanner.skipJreProvisioning=true
  only:
    - main
    - merge_requests
  allow_failure: true

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact
  allow_failure: false

build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $BACKEND_IMAGE:latest ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  rules:
    - changes:
        - backend/**/*

build-frontend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $FRONTEND_IMAGE:latest ./ktebna
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  rules:
    - changes:
        - ktebna/**/*

trivy-backend-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: build-backend
      optional: true
  script:
    - trivy image --exit-code 0 --severity LOW,MEDIUM $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: true
  rules:
    - changes:
        - backend/**/*

trivy-frontend-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: build-frontend
      optional: true
  script:
    - trivy image --exit-code 0 --severity LOW,MEDIUM $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: true
  rules:
    - changes:
        - ktebna/**/*

trivy-fs-backend:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --offline-scan --exit-code 0 --severity LOW,MEDIUM ./backend
    - trivy fs --scanners vuln --offline-scan --exit-code 1 --severity HIGH,CRITICAL ./backend
  allow_failure: true