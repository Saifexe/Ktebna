stages:
  - test
  - sonarcloud
  - security
  - build
  - scan

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: maven-repo
  paths:
    - .m2/repository

############################
# TEST
############################

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn test -B
  rules:
    - changes:
        - backend/**/*

frontend-lint:
  stage: test
  image: node:20-alpine
  script:
    - cd ktebna
    - npm ci
    - npm run lint
  rules:
    - changes:
        - ktebna/**/*

############################
# SONARCLOUD
############################

sonarcloud-check:
  stage: sonarcloud
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    GIT_DEPTH: "0"
  script:
    - >
      sonar-scanner
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.organization=saifexd-group
      -Dsonar.projectKey=saifexd-group_ktebna
      -Dsonar.sources=.
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.scanner.skipJreProvisioning=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: false

############################
# SECURITY
############################

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact
  allow_failure: false

trivy-fs-backend:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --offline-scan --exit-code 0 --severity LOW,MEDIUM ./backend
    - trivy fs --scanners vuln --offline-scan --exit-code 1 --severity HIGH,CRITICAL ./backend
  allow_failure: false

############################
# BUILD
############################

build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$BACKEND_IMAGE:latest" ./backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - changes:
        - backend/**/*

build-frontend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$FRONTEND_IMAGE:latest" ./ktebna
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - changes:
        - ktebna/**/*

############################
# IMAGE SCANNING
############################

trivy-backend-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-backend
  script:
    - trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --exit-code 0 --severity LOW,MEDIUM "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --exit-code 1 --severity HIGH,CRITICAL "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
  allow_failure: false
  rules:
    - changes:
        - backend/**/*

trivy-frontend-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-frontend
  script:
    - trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --exit-code 0 --severity LOW,MEDIUM "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --exit-code 1 --severity HIGH,CRITICAL "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
  allow_failure: false
  rules:
    - changes:
        - ktebna/**/*