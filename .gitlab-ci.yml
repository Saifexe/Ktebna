stages:
  - test
  - sonarcloud
  - security
  - build
  - scan


variables:
  DOCKER_TLS_CERTDIR: ""

  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"


cache:
  key: maven-repo
  paths:
    - .m2/repository


####################
# TEST STAGE
####################

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17

  script:
    - cd backend
    - mvn test -B


frontend-lint:
  stage: test
  image: node:20-alpine

  script:
    - cd ktebna
    - npm ci
    - npm run lint



####################
# SONARCLOUD STAGE
####################

sonarcloud-check:
  stage: sonarcloud

  image:
    name: sonarsource/sonar-scanner-cli:latest

  variables:
    GIT_DEPTH: "0"

  script:
    - sonar-scanner
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.organization=saifexd-group
      -Dsonar.projectKey=saifexd-group_ktebna
      -Dsonar.sources=.
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.scanner.skipJreProvisioning=true

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  allow_failure: true



####################
# SECURITY STAGE
####################

gitleaks:
  stage: security

  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  script:
    - gitleaks detect --source . --verbose --redact



trivy-fs-backend:
  stage: security

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy fs --scanners vuln --offline-scan --exit-code 0 --severity LOW,MEDIUM ./backend
    - trivy fs --scanners vuln --offline-scan --exit-code 1 --severity HIGH,CRITICAL ./backend

  allow_failure: true



####################
# BUILD STAGE
####################

build-backend:

  stage: build

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_HOST: tcp://docker:2375

  script:

    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

    - docker build
      -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $BACKEND_IMAGE:latest
      ./backend

    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest



build-frontend:

  stage: build

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_HOST: tcp://docker:2375

  script:

    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

    - docker build
      -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $FRONTEND_IMAGE:latest
      ./ktebna

    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest



####################
# IMAGE SCAN STAGE
####################

trivy-backend-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: build-backend
      optional: true
  script:
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 0 --severity LOW,MEDIUM $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 1 --severity HIGH,CRITICAL $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: true
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

trivy-frontend-image:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-frontend
  script:
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 0 --severity LOW,MEDIUM $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD --exit-code 1 --severity HIGH,CRITICAL $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: true
  rules:
    - changes:
        - ktebna/**/*
        - .gitlab-ci.yml