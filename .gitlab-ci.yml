stages:
  - test
  - sonarcloud
  - security
  - build
  - scan
  - publish


variables:
  DOCKER_TLS_CERTDIR: ""

  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"


cache:
  key: maven-repo
  paths:
    - .m2/repository


# The nightly schedule only re-scans the published images (see NIGHTLY SCAN);
# every regular job extends this so it is skipped in that pipeline.
.skip-on-schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success


####################
# TEST STAGE
####################

backend-test:
  extends: .skip-on-schedule
  stage: test
  image: maven:3.9-eclipse-temurin-17

  # Integration tests start a real MySQL 8 with Testcontainers, so the job
  # needs a Docker daemon (same dind setup as the build jobs).
  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # The dind service is thrown away with the job, so the reaper isn't needed.
    TESTCONTAINERS_RYUK_DISABLED: "true"

  script:
    - cd backend
    - mvn test -B
    # LINE_MISSED / LINE_COVERED are columns 8 and 9 of JaCoCo's CSV.
    - |
      awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "Line coverage: %.1f%%\n", 100*c/(c+m)}' target/site/jacoco/jacoco.csv

  coverage: '/Line coverage: \d+\.\d+%/'

  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: backend/target/site/jacoco/jacoco.xml
    paths:
      - backend/target/site/jacoco/jacoco.xml
      - backend/target/classes/
    expire_in: 1 week


frontend-test:
  extends: .skip-on-schedule
  stage: test
  image: node:22-alpine

  script:
    - cd ktebna
    - npm ci
    - npm run lint
    - npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=junit.xml
    # lcov paths are relative to ktebna/; SonarCloud resolves them from the repo root.
    - sed -i 's#^SF:#SF:ktebna/#' coverage/lcov.info

  coverage: '/Lines\s*:\s*\d+\.\d+%/'

  artifacts:
    when: always
    reports:
      junit: ktebna/junit.xml
    paths:
      - ktebna/coverage/lcov.info
    expire_in: 1 week



####################
# SONARCLOUD STAGE
####################

# Blocking gate: sonar.qualitygate.wait makes the scanner wait for SonarCloud's
# verdict and fail the job when the quality gate fails ("Sonar way": new code
# needs A ratings, 80% coverage, at most 3% duplication), which stops the
# pipeline before anything is built or published.
sonarcloud-check:
  stage: sonarcloud

  image:
    name: sonarsource/sonar-scanner-cli:latest

  variables:
    GIT_DEPTH: "0"

  script:
    - sonar-scanner
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.organization=saifexd-group
      -Dsonar.projectKey=saifexd-group_ktebna
      -Dsonar.sources=.
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.scanner.skipJreProvisioning=true
      -Dsonar.exclusions=backend/src/test/**,**/node_modules/**,**/dist/**,ktebna/coverage/**,ktebna/src/**/*.test.js,ktebna/src/**/*.test.jsx,ktebna/src/test/**
      -Dsonar.java.binaries=backend/target/classes
      -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
      -Dsonar.javascript.lcov.reportPaths=ktebna/coverage/lcov.info
      -Dsonar.cpd.exclusions=ktebna/src/locales/**,ktebna/src/i18n.js
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'



####################
# SECURITY STAGE
####################

gitleaks:
  extends: .skip-on-schedule
  stage: security

  image:
    # Pinned: a scanner that changes under you makes gate results unreproducible.
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]

  variables:
    # Full clone, so every commit is scanned (a secret deleted in a later
    # commit is still exposed in history).
    GIT_DEPTH: "0"

  script:
    # Current files (including untracked build output in the job workspace)...
    - gitleaks dir . --verbose --redact
    # ...and the entire git history. Reviewed false positives: .gitleaksignore
    - gitleaks git . --verbose --redact --log-opts="--all"



# Trivy policy for every scan below: the first command reports everything
# (never fails); the second is the gate and fails the job on any HIGH/CRITICAL
# that has a fix available. Unfixed CVEs stay visible in the report but can't
# block, since there would be nothing to upgrade to.
trivy-fs-backend:
  extends: .skip-on-schedule
  stage: security

  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]

  script:
    # --offline-scan: Maven Central rate-limits (429) repeated POM lookups from CI IPs.
    - trivy fs --scanners vuln --offline-scan --exit-code 0 ./backend
    - trivy fs --scanners vuln --offline-scan --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ./backend


trivy-fs-frontend:
  extends: .skip-on-schedule
  stage: security

  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]

  script:
    - trivy fs --scanners vuln --exit-code 0 ./ktebna
    - trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ./ktebna



####################
# BUILD STAGE
####################
# Images are built and saved as job artifacts, not pushed: nothing reaches the
# registry until the scan stage has passed (see PUBLISH STAGE).

build-backend:
  extends: .skip-on-schedule

  stage: build

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_HOST: tcp://docker:2375

  script:

    - docker build
      -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $BACKEND_IMAGE:latest
      ./backend

    - docker save $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest | gzip > backend-image.tar.gz

  artifacts:
    paths:
      - backend-image.tar.gz
    # Only needed by this pipeline's scan and publish jobs (minutes), and each
    # copy is hundreds of MB of project storage, so don't keep it for a day.
    expire_in: 2 hours



build-frontend:
  extends: .skip-on-schedule

  stage: build

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    # `--secret` needs BuildKit; don't rely on the CLI default.
    DOCKER_BUILDKIT: "1"

  script:

    # The Maps key goes in as a BuildKit secret (never a --build-arg), so it
    # doesn't end up in the image history. Exported even when unset, because
    # `env=` needs the variable to exist; an empty key just hides the maps.
    # VITE_API_URL defaults to empty: the image's nginx proxies /api and
    # /uploads, so the browser calls its own origin. A localhost:8080 default
    # baked that address into every published image, which breaks in k8s.
    - export VITE_GOOGLE_MAPS_API_KEY="${VITE_GOOGLE_MAPS_API_KEY:-}"
    - docker build
      --secret id=maps_key,env=VITE_GOOGLE_MAPS_API_KEY
      --build-arg VITE_API_URL=${VITE_API_URL:-}
      --build-arg VITE_GOOGLE_MAPS_MAP_ID=${VITE_GOOGLE_MAPS_MAP_ID:-}
      -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $FRONTEND_IMAGE:latest
      ./ktebna

    - docker save $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest | gzip > frontend-image.tar.gz

  artifacts:
    paths:
      - frontend-image.tar.gz
    # Only needed by this pipeline's scan and publish jobs (minutes), and each
    # copy is hundreds of MB of project storage, so don't keep it for a day.
    expire_in: 2 hours



####################
# IMAGE SCAN STAGE
####################

trivy-backend-image:
  extends: .skip-on-schedule
  stage: scan
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - build-backend
  script:
    - trivy image --input backend-image.tar.gz --exit-code 0
    - trivy image --input backend-image.tar.gz --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed

trivy-frontend-image:
  extends: .skip-on-schedule
  stage: scan
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - build-frontend
  script:
    - trivy image --input frontend-image.tar.gz --exit-code 0
    - trivy image --input frontend-image.tar.gz --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed



####################
# PUBLISH STAGE
####################
# Runs only when the image's own scan passed; pushes exactly the bytes scanned.

publish-backend:
  extends: .skip-on-schedule
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  needs:
    - build-backend
    - job: trivy-backend-image
      artifacts: false
  script:
    - docker load < backend-image.tar.gz
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest

publish-frontend:
  extends: .skip-on-schedule
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  needs:
    - build-frontend
    - job: trivy-frontend-image
      artifacts: false
  script:
    - docker load < frontend-image.tar.gz
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest



####################
# NIGHTLY SCAN
####################
# New CVEs are published every day, so an image that passed its scan at push
# time can become vulnerable without any code change. A pipeline schedule
# (CI/CD > Schedules, nightly on main) runs only these jobs: they re-scan the
# images already in the registry, with the same gate as the scan stage.

.nightly-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs: []
  variables:
    # Trivy pulls straight from the GitLab registry with the job's own token.
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - trivy image --exit-code 0 "$IMAGE:latest"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:latest"

nightly-scan-backend:
  extends: .nightly-scan
  variables:
    IMAGE: $BACKEND_IMAGE

nightly-scan-frontend:
  extends: .nightly-scan
  variables:
    IMAGE: $FRONTEND_IMAGE
