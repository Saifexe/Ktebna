# Full local stack. Secrets come from the git-ignored .env at the repo root;
# `docker compose` refuses to start if a required one is missing, instead of
# silently falling back to a publicly known default.
#
# Every port is bound to 127.0.0.1, so nothing is reachable from other machines
# on your network. To demo the app on your LAN, change only the frontend
# mapping to "5173:8080". Never expose MySQL, the backend, Prometheus or Grafana.

services:
  mysql:
    image: mysql:8.0
    container_name: ktebna-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ktebna
      MYSQL_USER: ktebna_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Read the password from the container's own env instead of baking it
      # into the healthcheck definition (visible in `docker inspect`).
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ktebna-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ktebna
      DB_USER: ktebna_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DDL_AUTO: update
    ports:
      # Published for the Vite dev server (VITE_API_URL=http://localhost:8080).
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./ktebna
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
      # Passed as a build secret, not an arg (see ktebna/Dockerfile). After
      # changing the key, rebuild with: docker compose build --no-cache frontend
      secrets:
        - maps_key
    container_name: ktebna-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:8080"

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: ktebna-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ktebna-alertmanager
    restart: unless-stopped
    # Fills the email settings into the config, then starts Alertmanager.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      # All optional: without ALERT_EMAIL_TO, alerts show in the UI only.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-smtp.gmail.com:587}
      # Written to a private file by entrypoint.sh; never put in the config.
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:13.1.3
    container_name: ktebna-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

secrets:
  maps_key:
    environment: VITE_GOOGLE_MAPS_API_KEY

volumes:
  mysql_data:
  uploads_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
