services:
  mysql:
    image: mysql:8.0
    container_name: ktebna-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ktebna
      MYSQL_USER: ktebna_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ktebna-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ktebna
      DB_USER: ktebna_user
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-of-at-least-32-characters}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DDL_AUTO: update
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./ktebna
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: ktebna-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  uploads_data:
